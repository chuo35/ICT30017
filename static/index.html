<!DOCTYPE html>
<html>
<head>
    <title>NanoClaw Assistant</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; }
        #chat { height: 400px; border: 1px solid #ccc; overflow-y: scroll; padding: 10px; margin-bottom: 10px; }
        .user { color: blue; } .bot { color: green; } .note { color: orange; font-style: italic; }
    </style>
</head>
<body>
    <div id="chat"></div>
    <input type="text" id="msg" placeholder="Type a message..." style="width: 80%">
    <button onclick="send()">Send</button>

    <script>
        const apiKey = "YOUR_OWNER_ID_HERE"; // Must match your .env OWNER_ID

        async function send() {
            const input = document.getElementById('msg');
            const chat = document.getElementById('chat');
            const text = input.value;
            input.value = '';
            
            chat.innerHTML += `<p class="user"><b>You:</b> ${text}</p>`;
            
            const res = await fetch('/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-API-KEY': apiKey },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            chat.innerHTML += `<p class="bot"><b>Bot:</b> ${data.response}</p>`;
            chat.scrollTop = chat.scrollHeight;
        }

        // Check for notifications (reminders) every 10 seconds
        setInterval(async () => {
            const res = await fetch('/notifications', { headers: { 'X-API-KEY': apiKey } });
            const data = await res.json();
            data.notifications.forEach(n => {
                document.getElementById('chat').innerHTML += `<p class="note"><b>Reminder:</b> ${n.content}</p>`;
            });
        }, 10000);
    </script>
</body>
</html>
